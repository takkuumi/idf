[package]
name = "esp32s3-iot-gateway"
version = "2.2.1"
edition = "2024"
authors = ["idf"]
description = "ESP32-S3R2 嵌入式网关：以太网 W5500 + BLE + IO + AI/AO + RS485 + Modbus"
license = "MIT OR Apache-2.0"

[[bin]]
name = "gateway"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 2
lto = false
codegen-units = 1
panic = "unwind"

[features]
default = ["ble-at", "adc-continuous", "ethernet-w5500", "modbus-rtu", "modbus-tcp", "ai-ao", "io-di-do"]
adc-continuous = []
wifi = []
ble-at = []
ethernet-w5500 = []
modbus-rtu = []
modbus-tcp = []
ai-ao = []
io-di-do = []
f3 = ["io-di-do"]
f4 = ["io-di-do"]

[dependencies]
esp-idf-sys = { version = "0.37", features = ["binstart"] }
esp-idf-hal = { version = "0.46", default-features = false, features = ["std"] }
esp-idf-svc = { version = "0.52", features = ["alloc"] }

embedded-hal = "1.0"

log = { version = "0.4", default-features = false }
anyhow = { version = "1", default-features = false, features = ["std"] }

# heapless 升级至 0.9.3 (无 heap 分配数据结构: Vec/String/IndexMap)
heapless = "0.9.3"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[patch.crates-io]
