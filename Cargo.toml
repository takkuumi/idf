[package]
name = "esp32s3-iot-gateway"
version = "0.1.0"
edition = "2024"
authors = ["idf"]
description = "ESP32-S3R8 嵌入式网关：以太网 W5500 + BLE Mesh + IO + AI/AO + RS485 + Modbus"
license = "MIT OR Apache-2.0"

[[bin]]
name = "gateway"
path = "src/main.rs"

[profile.release]
# opt-level=3 优先性能 (Flash 8MB 充足, 实时系统关注 Modbus CRC/ADC 滤波延迟)
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
# dev 用 opt-level=2 保证基本可用; panic=unwind 便于 panic backtrace 调试
opt-level = 2
lto = false
codegen-units = 1
panic = "unwind"

[features]
# 默认启用 ADC Continuous/DMA (ESP32-S3 硬件潜力)
# 如需回退到 OneShot: --no-default-features --features "ble-mesh,ethernet-w5500,..."
default = ["adc-continuous", "ble-mesh", "ethernet-w5500", "modbus-rtu", "modbus-tcp", "ai-ao", "io-di-do"]
adc-continuous = []
# Wi-Fi 支持 (ESP32-S3 内置, 作为以太网冗余或 AP 配置入口)
wifi = []
ble-mesh = []
ethernet-w5500 = []
modbus-rtu = []
modbus-tcp = []
ai-ao = []
io-di-do = []

# ---- 硬件版本 (F3/F4, 编译期 feature flag, 互斥) ----
# F3: 16 DI + 16 DO (I2C MCP23017 扩展: 2 片, DI=0x20, DO=0x21)
# F4: 48 DI + 16 DO (I2C MCP23017 扩展: 4 片, DI=0x20/0x21/0x22, DO=0x23)
# 默认 (无 f3/f4): 8 DI + 8 DO (直接 GPIO)
# 用法: `cargo build --features f3` 或 `cargo build --features f4`
# 启用 f3/f4 后, io-di-do 自动启用, I2C 总线占用 GPIO21(SDA)/GPIO33(SCL)
f3 = ["io-di-do"]
f4 = ["io-di-do"]

[dependencies]
# ESP-IDF Rust 生态
esp-idf-sys = { version = "0.37", features = ["binstart"] }
esp-idf-hal = { version = "0.46", default-features = false, features = ["std"] }
esp-idf-svc = { version = "0.52", features = ["alloc"] }

# 嵌入式 HAL trait (供未来 driver trait 使用)
embedded-hal = "1.0"

# 日志
log = { version = "0.4", default-features = false }
anyhow = { version = "1", default-features = false, features = ["std"] }

# 工具
heapless = "0.8"
parking_lot = "0.12"
once_cell = { version = "1", default-features = false, features = ["std"] }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[patch.crates-io]
# 如需用本地或 git 版本可在此 patch
