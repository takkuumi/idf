<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 - ESP32-S3 网关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
background:#0f1419;color:#e0e0e0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.login{background:#1a1f26;border-radius:12px;padding:40px 36px;width:380px;max-width:92vw;
box-shadow:0 8px 32px rgba(0,0,0,.4)}
.login h1{font-size:20px;font-weight:600;text-align:center;margin-bottom:6px}
.login .sub{text-align:center;font-size:13px;color:#7a8a9a;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:#8a9aaa;margin-bottom:5px}
.field input{width:100%;padding:10px 12px;background:#141920;border:1px solid #2a3340;
border-radius:6px;color:#e0e0e0;font-size:14px;outline:none;transition:border .2s}
.field input:focus{border-color:#4a9eff}
.btn{width:100%;padding:11px;background:linear-gradient(135deg,#2a7fff,#1a6adf);
border:none;border-radius:6px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;
transition:opacity .2s}
.btn:hover{opacity:.88}
.btn:active{opacity:.75}
.error{color:#ff6b6b;font-size:13px;text-align:center;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<div class="login">
  <h1>ESP32-S3 IoT Gateway</h1>
  <p class="sub">工业测控执行器 · 配置面板</p>
  <form id="f">
    <div class="field"><label>用户名</label><input id="u" name="username" value="admin" autocomplete="username"></div>
    <div class="field"><label>密码</label><input id="p" name="pwd" type="password" autocomplete="current-password"></div>
    <button class="btn" type="submit">登 录</button>
  </form>
  <div class="error" id="err"></div>
</div>
<script>
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  const r=await fetch('/login',{method:'POST',body:new URLSearchParams(fd)});
  const j=await r.json();
  if(j.code==='0'){location.href='/';}
  else{
    const m={'0x01000001':'用户名不存在','0x01000002':'密码错误'};
    document.getElementById('err').textContent=m[j.code]||('错误: '+j.code);
  }
};
</script>
</body></html>
