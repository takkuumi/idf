<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工业测控执行器管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1419;--card:#1a1f26;--border:#2a3340;--text:#e0e0e0;--dim:#7a8a9a;
--accent:#4a9eff;--green:#34d399;--red:#f87171;--amber:#fbbf24}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--text);line-height:1.5}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;
background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.top h1{font-size:16px;font-weight:600}
.top .ver{font-size:12px;color:var(--dim);margin-left:10px}
.top a{color:var(--accent);font-size:13px;text-decoration:none}
.top a:hover{text-decoration:underline}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:16px;padding:4px;
background:#141920;border:1px solid var(--border);border-radius:7px}
.tab{min-height:40px;padding:9px 12px;font-size:13px;color:var(--dim);cursor:pointer;text-align:center;
border:1px solid transparent;border-radius:5px;transition:.2s;display:flex;align-items:center;justify-content:center}
.tab:hover{color:var(--text);background:#1c232c}
.tab.active{color:#fff;background:#253548;border-color:#3c5b7d}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:14px}
.card h2{font-size:14px;font-weight:600;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.field input,.field select{width:100%;padding:8px 10px;background:#141920;border:1px solid var(--border);
border-radius:5px;color:var(--text);font-size:13px;outline:none}
.field input:not(:disabled),.field select:not(:disabled){background:#101820;border-color:#455568}
.field input:not(:disabled):hover,.field select:not(:disabled):hover{border-color:#60758c}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.14)}
.read-value{display:flex;align-items:center;width:100%;min-height:36px;padding:8px 10px;background:#252b32;
border:1px dashed #3a4652;border-radius:5px;color:#aab6c1;font-size:13px;overflow-wrap:anywhere}
.read-value::before{content:"";width:6px;height:6px;border-radius:50%;background:#657483;margin-right:8px;flex-shrink:0}
.btn{padding:9px 20px;border:none;border-radius:5px;font-size:13px;font-weight:500;cursor:pointer;transition:.2s}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{opacity:.85}
.btn-w{background:var(--amber);color:#1a1a1a}.btn-w:hover{opacity:.85}
.btn-d{background:#2a3340;color:var(--text)}.btn-d:hover{background:#3a4350}
.btn:disabled{cursor:not-allowed;opacity:.55}
.di-list,.do-list,.state-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.io-item{display:flex;align-items:center;gap:8px;padding:8px;background:#141920;border-radius:6px;font-size:12px}
.led{width:10px;height:10px;border-radius:50%;background:#2a3340;flex-shrink:0;transition:.15s}
.led.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.led.do-off{background:#4a4a4a}.led.do-on{background:var(--red);box-shadow:0 0 6px var(--red)}
.tgl{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.tgl input{display:none}.tgl .slider{position:absolute;inset:0;background:#4a4a4a;border-radius:10px;cursor:pointer;transition:.2s}
.tgl .slider:before{content:"";position:absolute;width:16px;height:16px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s}
.tgl input:checked+.slider{background:var(--green)}.tgl input:checked+.slider:before{transform:translateX(16px)}
.ai-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#141920;border-radius:6px;font-size:13px}
.ai-bar{flex:1;height:6px;background:#2a3340;border-radius:3px;overflow:hidden}
.ai-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .3s}
.ai-val{font-size:18px;font-weight:600;min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.ai-ma{font-size:11px;color:var(--dim);min-width:50px}
.nav{display:flex;gap:10px;margin-top:14px}
.port-card{padding:14px 0;border-bottom:1px solid var(--border)}
.port-card:first-of-type{padding-top:0}.port-card:last-of-type{border-bottom:0;padding-bottom:0}
.port-card h3{font-size:13px;color:var(--accent);margin-bottom:10px}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:6px;font-size:13px;
transform:translateY(80px);opacity:0;transition:.3s;z-index:100}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{background:#0d3320;color:var(--green);border:1px solid #1a5c3a}
.toast.err{background:#3d1a1a;color:var(--red);border:1px solid #5c2a2a}
.ota-bar{height:8px;background:#2a3340;border-radius:4px;margin:10px 0;overflow:hidden}
.ota-bar i{display:block;height:100%;background:var(--accent);border-radius:4px;width:0;transition:width .3s}
@media(max-width:640px){
  .top{padding:12px}.top h1{font-size:14px}.top .ver{display:none}.wrap{padding:10px}
  .row{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:15px}.nav{flex-wrap:wrap}.nav .btn{flex:1;min-width:130px}
}
.hidden{display:none}
</style>
</head>
<body>

<div class="top">
  <div style="display:flex;align-items:center;gap:8px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
      <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/>
      <line x1="12" y1="17" x2="12" y2="21"/></svg>
    <h1>工业测控执行器管理系统</h1>
    <span class="ver" id="fw_ver"></span>
  </div>
  <a href="/logout">退出登录</a>
</div>

<div class="wrap">
  <div class="tabs">
    <div class="tab active" data-t="monitor">运行监控</div>
    <div class="tab" data-t="config">基本配置</div>
    <div class="tab" data-t="port">通信设置</div>
    <div class="tab" data-t="maint">系统维护</div>
  </div>

  <!-- 运行监控面板 -->
  <div id="p-monitor">
    <div class="card">
      <h2>I/O口信息 · 设备状态</h2>
      <div class="state-list" id="state_list"></div>
    </div>
    <div class="card">
      <h2>数字输入 (DI)</h2>
      <div class="di-list" id="di_list"></div>
    </div>
    <div class="card">
      <h2>数字输出 (DO)</h2>
      <div class="do-list" id="do_list"></div>
    </div>
    <div class="card">
      <h2>模拟输入 (AI)</h2>
      <div id="ai_list"></div>
    </div>
    <div class="card">
      <h2>运行状态</h2>
      <div class="row" id="runtime_status">
        <div class="field"><label>运行时间</label><output class="read-value" id="st_uptime">-</output></div>
        <div class="field"><label>以太网链路</label><output class="read-value" id="st_eth">-</output></div>
        <div class="field"><label>BLE 连接</label><output class="read-value" id="st_ble">-</output></div>
        <div class="field"><label>UDP 组播</label><output class="read-value" id="st_udp">-</output></div>
        <div class="field"><label>RS485-1 通信错误</label><output class="read-value" id="st_rtu1_com">-</output></div>
        <div class="field"><label>RS485-1 应用错误</label><output class="read-value" id="st_rtu1_app">-</output></div>
        <div class="field"><label>RS485-2 通信错误</label><output class="read-value" id="st_rtu2_com">-</output></div>
        <div class="field"><label>RS485-2 应用错误</label><output class="read-value" id="st_rtu2_app">-</output></div>
        <div class="field"><label>恢复模式</label><output class="read-value" id="st_recovery">-</output></div>
        <div class="field"><label>剩余堆内存</label><output class="read-value" id="st_heap">-</output></div>
        <div class="field"><label>复位次数</label><output class="read-value" id="st_reset">-</output></div>
        <div class="field"><label>复位原因</label><output class="read-value" id="st_reason">-</output></div>
      </div>
    </div>
  </div>

  <!-- 基本配置面板 -->
  <div id="p-config" class="hidden">
    <div class="card">
      <h2>系统信息</h2>
      <div class="row">
        <div class="field"><label>设备名称</label><input id="s_devicename" maxlength="63"></div>
        <div class="field"><label>制造商</label><input id="s_manufacturer" maxlength="63"></div>
        <div class="field"><label>型号</label><input id="s_model" maxlength="63"></div>
        <div class="field"><label>固件版本</label><output class="read-value" id="s_version">-</output></div>
      </div>
      <div class="nav">
        <button class="btn btn-p" onclick="saveSystemInfo()">保存系统信息</button>
      </div>
    </div>
    <div class="card">
      <h2>网络参数</h2>
      <div class="row">
        <div class="field"><label>IP 地址</label><input id="n_ip"></div>
        <div class="field"><label>子网掩码</label><input id="n_mask"></div>
        <div class="field"><label>默认网关</label><input id="n_gw"></div>
        <div class="field"><label>DNS</label><input id="n_dns"></div>
        <div class="field"><label>MAC 地址</label><output class="read-value" id="n_mac">-</output></div>
        <div class="field"><label>DHCP</label><output class="read-value" id="n_dhcp">-</output></div>
      </div>
      <div class="nav">
        <button class="btn btn-p" onclick="saveNetwork()">保存网络参数</button>
        <button class="btn btn-w" id="network_reboot_btn" onclick="saveNetwork(true)">保存网络参数并重启</button>
      </div>
    </div>
    <div class="card">
      <h2>设备基本信息</h2>
      <div class="row">
        <div class="field"><label>SN 序列号</label><input id="n_sn" maxlength="32"></div>
        <div class="field"><label>位置/桩号</label><input id="n_loc" maxlength="16"></div>
        <div class="field"><label>蓝牙地址</label><input id="n_ble" maxlength="8"></div>
      </div>
      <div class="nav">
        <button class="btn btn-p" onclick="saveIdentity()">保存设备基本信息</button>
      </div>
    </div>
  </div>

  <!-- RS485 端口面板 -->
  <div id="p-port" class="hidden">
    <div class="card" id="port_cards"><h2>端口设置</h2></div>
  </div>

  <!-- 系统维护面板 -->
  <div id="p-maint" class="hidden">
    <div class="card">
      <h2>用户设置</h2>
      <div class="row">
        <div class="field"><label>旧密码</label><input id="pw_old" type="password"></div>
        <div class="field"><label>新密码</label><input id="pw_new" type="password"></div>
      </div>
      <div class="nav">
        <button class="btn btn-w" onclick="changePwd()">修改密码</button>
      </div>
    </div>
    <div class="card">
      <h2>系统维护 · NFC 配置</h2>
      <div class="row">
        <div class="field"><label>NFC 服务</label><output class="read-value" id="nfc_started">-</output></div>
        <div class="field"><label>NFC 状态</label><output class="read-value" id="nfc_state">-</output></div>
      </div>
      <div class="nav">
        <button class="btn btn-p" onclick="nfcBackup()">备份配置</button>
        <button class="btn btn-w" onclick="nfcRestore()">恢复配置</button>
      </div>
    </div>
    <div class="card">
      <h2>设备重启</h2>
      <div class="nav">
        <button class="btn btn-w" id="reboot_btn" onclick="rebootDevice()">重启设备</button>
      </div>
    </div>
    <div class="card">
      <h2>固件升级 (OTA)</h2>
      <div class="field"><label>固件文件 (.bin)</label><input type="file" id="ota_file" accept=".bin"></div>
      <div class="ota-bar hidden" id="ota_bar"><i id="ota_prog"></i></div>
      <div class="nav">
        <button class="btn btn-p" onclick="uploadOta()">上传固件</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// Tab switching
$$('.tab').forEach(t => t.onclick = () => {
  $$('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  ['monitor','config','port','maint'].forEach(k => {
    $('#p-' + k).classList.toggle('hidden', k !== t.dataset.t);
  });
});

// Toast
let toastTimer;
function toast(msg, ok) {
  const el = $('#toast');
  clearTimeout(toastTimer);
  el.textContent = msg;
  el.className = 'toast show ' + (ok ? 'ok' : 'err');
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

function apiError(code, fallback) {
  const errors = {
    '0x01000001': '缺少必要参数',
    '0x01000003': '参数格式错误或保存失败',
    '0x01000004': '参数超出允许范围',
    '0x01000005': '设备存储任务繁忙，请稍后重试',
    '405': '请求方式错误',
    '500': '设备内部错误'
  };
  return errors[code] || fallback + ': ' + code;
}

function saveError(area, error) {
  const message = error instanceof Error ? error.message : String(error);
  return message.startsWith(area + '保存失败') ? message : area + '保存失败: ' + message;
}

// Load system info
async function loadSysInfo() {
  try {
    const r = await fetch('/getsysteminfo');
    const j = await r.json();
    if (j.data) {
      $('#fw_ver').textContent = j.data.version || '';
      $('#s_devicename').value = j.data.devicename || '';
      $('#s_manufacturer').value = j.data.manufacturer || '';
      $('#s_model').value = j.data.model || '';
      $('#s_version').textContent = j.data.version || '-';
    }
  } catch(e) { console.error('sysinfo', e); }
}

// Load network config
async function loadNet() {
  try {
    const r = await fetch('/getnetworkconfig');
    const j = await r.json();
    if (j.data) {
      $('#n_ip').value = j.data.ip || '';
      $('#n_mask').value = j.data.mask || '';
      $('#n_gw').value = j.data.gateway || '';
      $('#n_dns').value = j.data.dns || '';
      $('#n_mac').textContent = j.data.mac || '-';
      $('#n_dhcp').textContent = j.data.dhcp ? '已启用' : '未启用';
      $('#n_sn').value = j.data.sn || '';
      $('#n_ble').value = j.data.bloothaddress || '';
      if (j.data.addressinfo) $('#n_loc').value = j.data.addressinfo;
    }
  } catch(e) { console.error('net', e); }
}

// 网络参数与设备基本信息独立保存，避免一个按钮隐式提交另一组未确认的修改。
async function saveNetwork(restartAfter = false) {
  if (restartAfter && !confirm('确认保存网络参数并重启设备? 当前连接将暂时中断.')) return;
  try {
    const fd = new URLSearchParams({
      ip: $('#n_ip').value,
      mask: $('#n_mask').value,
      gateway: $('#n_gw').value,
      dns: $('#n_dns').value
    });
    const r = await fetch('/updatenetworkconfig', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.code !== '0') throw new Error(apiError(j.code, '网络参数保存失败'));
    if (restartAfter) {
      await rebootDevice('network_reboot_btn', true);
    } else {
      toast('网络参数已保存，重启设备后生效', true);
      await loadNet();
    }
  } catch(e) { toast(saveError('网络参数', e), false); }
}

async function saveIdentity() {
  try {
    const fd = new URLSearchParams({
      addressinfo: $('#n_loc').value,
      sn: $('#n_sn').value,
      bloothaddress: $('#n_ble').value
    });
    const r = await fetch('/updatenetworkconfig', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.code !== '0') throw new Error(apiError(j.code, '设备基本信息保存失败'));
    toast('设备基本信息已保存', true);
    await loadNet();
  } catch(e) { toast(saveError('设备基本信息', e), false); }
}

// Save system info
async function saveSystemInfo() {
  try {
    const fd = new URLSearchParams({
      devicename: $('#s_devicename').value,
      manufacturer: $('#s_manufacturer').value,
      model: $('#s_model').value
    });
    const r = await fetch('/updatesysteminfoconfig', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.code !== '0') throw new Error(apiError(j.code, '系统信息保存失败'));
    toast('系统信息已保存', true);
    await loadSysInfo();
  } catch(e) { toast(saveError('系统信息', e), false); }
}

// Load RS485 port config — 与原 C++ WebIndex 的 9 个参数完全对应
async function loadPorts() {
  try {
    const r = await fetch('/getportconfig');
    const j = await r.json();
    if (!j.data) return;
    const d = j.data;
    // 原 C++ WebIndex 的 baud 编号，不能改成实际波特率值，否则旧页面选择项错位
    const baudOptions = [
      [0, '9600'], [1, '1200'], [2, '2400'], [3, '4800'],
      [4, '9600'], [5, '14400'], [6, '19200'], [7, '38400'],
      [8, '57600'], [9, '115200'], [10, '128000'], [11, '153600'],
      [12, '230400'], [13, '256000'], [14, '460800'], [15, '921600']
    ];
    const modes = ['从站', '主站(客户端)', '从站(服务端)'];
    let html = '<h2>端口设置</h2>';
    for (let i = 0; i < 3; i++) {
      const v = (key, fallback) => d[key + i] === undefined ? fallback : d[key + i];
      html += `<div class="port-card">
        <h3>端口 ${i + 1}</h3>
        <div class="row">
          <div class="field"><label>数据长度</label><select id="p_datalen_${i}">
            <option value="0" ${v('datalen_',0)===0?'selected':''}>8位</option>
            <option value="1" ${v('datalen_',0)===1?'selected':''}>7位</option>
          </select></div>
          <div class="field"><label>校验方式</label><select id="p_checkmode_${i}">
            <option value="0" ${v('checkmode_',0)===0?'selected':''}>无校验</option>
            <option value="1" ${v('checkmode_',0)===1?'selected':''}>奇校验</option>
            <option value="2" ${v('checkmode_',0)===2?'selected':''}>偶校验</option>
          </select></div>
          <div class="field"><label>停止位</label><select id="p_stopbit_${i}">
            <option value="0" ${v('stopbit_',0)===0?'selected':''}>1位</option>
            <option value="1" ${v('stopbit_',0)===1?'selected':''}>2位</option>
          </select></div>
          <div class="field"><label>波特率</label><select id="p_baud_${i}">
            ${baudOptions.map(([n,label]) => `<option value="${n}" ${n===v('baud_',3)?'selected':''}>${label} (${n})</option>`).join('')}
          </select></div>
          <div class="field"><label>端口主从</label><select id="p_mode_${i}">
            ${modes.map((m,n) => `<option value="${n}" ${n===v('masterslaveport_',0)?'selected':''}>${m}</option>`).join('')}
          </select></div>
          <div class="field"><label>从站地址</label><input id="p_addr_${i}" type="number" min="1" max="247" value="${v('slaveaddress_',1)}"></div>
          <div class="field"><label>重试次数</label><input id="p_retry_${i}" type="number" min="0" max="65535" value="${v('retrycount_',3)}"></div>
          <div class="field"><label>发送响应间隔(ms)</label><input id="p_timeout_${i}" type="number" min="0" max="65535" value="${v('responeinteval_',1000)}"></div>
          <div class="field"><label>通信间隔(ms)</label><input id="p_tti_${i}" type="number" min="0" max="65535" value="${v('tti_',20)}"></div>
        </div>
      </div>`;
    }
    html += '<div class="nav"><button class="btn btn-p" onclick="savePorts()">保存端口配置</button>' +
      '<button class="btn btn-w" id="ports_reboot_btn" onclick="savePorts(true)">保存端口配置并重启</button></div>';
    $('#port_cards').innerHTML = html;
  } catch(e) { console.error('port', e); }
}

// Save RS485 port config — 9 个字段全部提交，不使用隐式默认值覆盖用户设置
async function savePorts(restartAfter = false) {
  if (restartAfter && !confirm('确认保存 3 个 RS485 端口配置并重启设备? 当前连接将暂时中断.')) return;
  try {
    for (let i = 0; i < 3; i++) {
      const fd = new URLSearchParams({
        index: i,
        datalen: $(`#p_datalen_${i}`).value,
        checkmode: $(`#p_checkmode_${i}`).value,
        stopbit: $(`#p_stopbit_${i}`).value,
        baud: $(`#p_baud_${i}`).value,
        masterslaveport: $(`#p_mode_${i}`).value,
        slaveaddress: $(`#p_addr_${i}`).value,
        retrycount: $(`#p_retry_${i}`).value,
        responeinteval: $(`#p_timeout_${i}`).value,
        tti: $(`#p_tti_${i}`).value,
      });
      const response = await fetch('/updateportconfig', { method: 'POST', body: fd });
      const result = await response.json();
      if (result.code !== '0') throw new Error(`端口${i+1}: ${result.code}`);
    }
    if (restartAfter) {
      await rebootDevice('ports_reboot_btn', true);
    } else {
      toast('3 个 RS485 端口配置已保存，重启设备后生效', true);
      await loadPorts();
    }
  } catch(e) { toast('端口配置保存失败: ' + e.message, false); }
}

// Poll IO data
let pollTimer;
async function pollIO() {
  try {
    const r = await fetch('/getiodata');
    const j = await r.json();
    if (!j.data) return;
    const d = j.data;

    // 原 MAC 页面固定显示 8 个状态灯: PWR/RUN/BT/LAN/485_1/485_2/FIB1/FIB2。
    const stateNames = ['PWR', 'RUN', 'BT', 'LAN', '485_1', '485_2', 'FIB1', 'FIB2'];
    $('#state_list').innerHTML = stateNames.map((name, i) => {
      const on = d.state_data && d.state_data['state_addr_' + i];
      return `<div class="io-item"><span class="led ${on ? 'on' : ''}"></span><span>${name}</span></div>`;
    }).join('');

    // DI
    let diHtml = '';
    if (d.di_data) {
      const keys = Object.keys(d.di_data).sort((a, b) =>
        Number(a.slice('di_addr_'.length)) - Number(b.slice('di_addr_'.length)));
      keys.forEach(k => {
        const n = Number(k.slice('di_addr_'.length));
        const on = d.di_data[k];
        diHtml += `<div class="io-item"><span class="led ${on?'on':''}"></span><span>DI${n + 1}</span></div>`;
      });
    }
    $('#di_list').innerHTML = diHtml;

    // DO
    let doHtml = '';
    if (d.do_data) {
      const keys = Object.keys(d.do_data).sort((a, b) =>
        Number(a.slice('do_addr_'.length)) - Number(b.slice('do_addr_'.length)));
      keys.forEach(k => {
        const n = Number(k.slice('do_addr_'.length));
        const on = d.do_data[k];
        doHtml += `<div class="io-item">
          <label class="tgl"><input type="checkbox" ${on?'checked':''} onchange="toggleDO(${n},this.checked)">
          <span class="slider"></span></label><span>DO${n + 1}</span></div>`;
      });
    }
    $('#do_list').innerHTML = doHtml;

    // AI
    let aiHtml = '';
    if (d.ai_data) {
      const keys = Object.keys(d.ai_data).sort();
      keys.forEach(k => {
        const n = k.replace('ai_addr_', '');
        const v = d.ai_data[k];
        const pct = Math.min(100, (v / 4095) * 100);
        aiHtml += `<div class="ai-item"><span style="min-width:32px;font-size:12px;color:var(--dim)">AI${n}</span>
          <div class="ai-bar"><i style="width:${pct}%"></i></div>
          <span class="ai-val">${v}</span></div>`;
      });
    }
    $('#ai_list').innerHTML = aiHtml;
  } catch(e) { console.error('poll', e); }
}

// Poll system status
async function pollStatus() {
  try {
    const r = await fetch('/getsystemstatus');
    const j = await r.json();
    if (!j.data) return;
    const d = j.data;
    const fmtSec = s => {
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      return `${h}h ${m}m ${sec}s`;
    };
    const resetReason = ['POWERON','SW','RTC_WDT','WDT','DEEP_SLEEP','RESTART','EXT_CPU','BOD','USB_UART','JTAG','EFUSE','PWR_GLITCH','RTC_STORE','SPI_FLASH','SYSCPU','BROWNOUT'];
    $('#st_uptime').textContent = fmtSec(d.uptime || 0);
    $('#st_eth').textContent = d.ethernet_link ? 'PHY UP' : 'PHY DOWN';
    $('#st_ble').textContent = d.ble_connected ? '已连接' : (d.ble_notify ? '通知已开' : '未连接');
    $('#st_udp').textContent = d.udp_multicast ? `已收 ${d.udp_received_bytes || 0} 字节` : '未接收';
    $('#st_rtu1_com').textContent = d.rs485_1_comerr || 0;
    $('#st_rtu1_app').textContent = d.rs485_1_apperr || 0;
    $('#st_rtu2_com').textContent = d.rs485_2_comerr || 0;
    $('#st_rtu2_app').textContent = d.rs485_2_apperr || 0;
    $('#st_recovery').textContent = `${d.recovery_mode} (R:${d.recoverable} D:${d.degradable} S:${d.severe})`;
    $('#st_heap').textContent = `${d.free_heap || 0} 字节`;
    $('#st_reset').textContent = d.reset_count || 0;
    $('#st_reason').textContent = resetReason[d.reset_reason] || ('0x' + (d.reset_reason || 0).toString(16));
  } catch(e) { console.error('status', e); }
}

// Toggle DO
async function toggleDO(addr, val) {
  try {
    const fd = new URLSearchParams({ type:'iocontrol', addr: addr, value: val ? 1 : 0 });
    const r = await fetch('/iocontrol', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.code !== '0') { toast('控制失败: ' + j.code, false); }
  } catch(e) { toast('控制失败: ' + e, false); }
}

// Change password
async function changePwd() {
  const opwd = $('#pw_old').value;
  const npwd = $('#pw_new').value;
  if (!opwd || !npwd) { toast('请填写旧密码和新密码', false); return; }
  try {
    const fd = new URLSearchParams({ opwd, npwd });
    const r = await fetch('/updatepwd', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.code === '0') {
      toast('密码已修改，即将退出登录', true);
      setTimeout(() => location.href = '/logout', 1500);
    } else {
      toast('修改失败: ' + (j.code === '0x00010001' ? '旧密码错误' : j.code), false);
    }
  } catch(e) { toast('修改失败: ' + e, false); }
}

async function pollNfcStatus() {
  try {
    const r = await fetch('/getnfcstatus');
    const j = await r.json();
    if (!j.data) return;
    $('#nfc_started').textContent = j.data.started ? '已启动' : '未启动';
    $('#nfc_state').textContent = j.data.state || 'Unknown';
  } catch(e) { console.error('nfc status', e); }
}

async function nfcBackup() {
  try {
    const r = await fetch('/nfcbackup', { method: 'POST' });
    const j = await r.json();
    toast(j.code === '0' ? 'NFC 备份请求已提交' : 'NFC 备份失败: ' + j.code, j.code === '0');
    setTimeout(pollNfcStatus, 5500);
  } catch(e) { toast('NFC 备份失败: ' + e, false); }
}

async function nfcRestore() {
  if (!confirm('确认用 NFC 快照覆盖当前设备配置?')) return;
  try {
    const r = await fetch('/nfcrestore', { method: 'POST' });
    const j = await r.json();
    toast(j.code === '0' ? 'NFC 恢复请求已提交' : 'NFC 恢复失败: ' + j.code, j.code === '0');
    setTimeout(pollNfcStatus, 5500);
  } catch(e) { toast('NFC 恢复失败: ' + e, false); }
}

let rebooting = false;
async function rebootDevice(buttonId = 'reboot_btn', afterConfigSave = false) {
  if (rebooting || (!afterConfigSave && !confirm('确认重启设备? 当前连接将暂时中断.'))) return;
  rebooting = true;
  const button = $('#' + buttonId);
  const originalLabel = button.textContent;
  button.disabled = true;
  button.textContent = '正在提交';
  try {
    const body = afterConfigSave ? new URLSearchParams({ after_config_save: '1' }) : undefined;
    const r = await fetch('/reboot', { method: 'POST', body });
    const j = await r.json();
    if (j.code !== '0') throw new Error(apiError(j.code, '重启请求失败'));
    clearInterval(pollTimer);
    clearInterval(statusTimer);
    clearInterval(nfcStatusTimer);
    let seconds = 8;
    button.textContent = `设备重启中 (${seconds}s)`;
    toast(afterConfigSave ? '配置已提交，成功落盘后设备将重启' : '重启指令已发送', true);
    const countdown = setInterval(() => {
      seconds -= 1;
      button.textContent = `设备重启中 (${seconds}s)`;
      if (seconds <= 0) {
        clearInterval(countdown);
        location.href = '/login';
      }
    }, 1000);
  } catch(e) {
    rebooting = false;
    button.disabled = false;
    button.textContent = originalLabel;
    toast('重启失败: ' + (e instanceof Error ? e.message : String(e)), false);
  }
}

// OTA upload
async function uploadOta() {
  const file = $('#ota_file').files[0];
  if (!file) { toast('请选择固件文件', false); return; }
  if (!confirm('确认上传固件? 设备将在上传完成后自动重启.')) return;

  $('#ota_bar').classList.remove('hidden');
  const prog = $('#ota_prog');
  prog.style.width = '0%';

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/updateota', true);
  xhr.setRequestHeader('Content-Type', 'application/octet-stream');

  xhr.upload.onprogress = e => {
    if (e.lengthComputable) {
      prog.style.width = Math.round(e.loaded / e.total * 100) + '%';
    }
  };
  xhr.onload = () => {
    try {
      const j = JSON.parse(xhr.responseText);
      if (j.code === '0') {
        toast('固件上传成功, 设备正在重启...', true);
        setTimeout(() => {
          let s = 10;
          const iv = setInterval(() => {
            toast(`设备重启中 (${--s}s)...`, true);
            if (s <= 0) { clearInterval(iv); location.href = '/'; }
          }, 1000);
        }, 2000);
      } else { toast('上传失败: ' + j.code, false); }
    } catch(e) { toast('上传失败', false); }
  };
  xhr.onerror = () => toast('上传失败: 网络错误', false);
  xhr.send(file);
}

// Init
loadSysInfo();
loadNet();
loadPorts();
pollIO();
pollTimer = setInterval(pollIO, 1500);
pollStatus();
const statusTimer = setInterval(pollStatus, 2000);
pollNfcStatus();
const nfcStatusTimer = setInterval(pollNfcStatus, 5000);
</script>
